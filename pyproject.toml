[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sillage"
version = "1.8.1"
description = "Gradient-free test-time memory and learning for frozen language models"
readme = "PYPI.md"          # the GitHub README uses repo-relative links
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abderrahmane Sghairi", email = "sghairipro63@gmail.com" }]
keywords = ["language-models", "associative-memory", "hebbian", "test-time-learning",
            "fast-weights", "gradient-free", "continual-learning", "vsa", "hyperdimensional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.51",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
research = ["scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/riscoss63/sillage"
Papers = "https://doi.org/10.5281/zenodo.22079016"

[project.scripts]
sillage = "sillage.cli:main"

[tool.setuptools]
packages = ["sillage"]
