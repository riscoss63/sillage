name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The mechanisms themselves need nothing but numpy: the Hebbian read and
    # write, the amplitude rule, forgetting, the delta-rule adapter, the state
    # round-trip and the passage splitter all run in a few seconds. The
    # end-to-end suite (test_sillage.py) downloads GPT-2 and is run locally.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy
      - run: python test_unit.py
      - name: the papers must still compile
        run: python papers/check_tex.py
