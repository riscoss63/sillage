name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    # The mechanisms need nothing but numpy: the Hebbian read and write, the
    # amplitude rule, forgetting, the delta-rule adapter, the state
    # round-trip, the readout tuner, the passage splitter, the cold
    # surprise-mass weighting, the blocked ingestion writes, the paper-8
    # semantic keys, the pickle-free state, the JSON index and the automatic
    # layer choice -- eighteen checks in all, and all of them in a few
    # seconds. Windows is
    # in the matrix because the tool claims to work there (it expands its own
    # globs, and writes its state with explicit encodings). The suites that
    # download GPT-2 (test_sillage.py for the tool, test_serve.py for the
    # HTTP service, test_axis4.py for watch, review, export and pull) are run
    # locally.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip numpy
      - run: python test_unit.py
      - name: the package must import and expose its command line
        run: |
          python -m pip install -e . --no-deps
          python -c "import sillage; print(sillage.__version__)"
          python -m sillage --help
      - name: the papers must still compile
        run: python papers/check_tex.py
